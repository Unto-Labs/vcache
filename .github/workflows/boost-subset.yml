# Traces the Boost headers clang opens on macOS, so the committed subset can
# cover it.
#
# The subset in third-party/boost is generated by compiling every translation
# unit with -H and keeping exactly the headers the compiler opened. That works
# for a compiler, but not for a platform: Boost selects its platform and
# standard-library config headers from predefined macros, so a run on Linux
# never opens boost/config/platform/macos.hpp or boost/config/stdlib/libcpp.hpp
# no matter which compilers it samples. Without them a macOS build stops on the
# guard in the top-level Makefile.
#
# The project has no Mac, so this borrows one. Run it by hand, download the
# artifact, and merge it into the committed subset:
#
#   gh workflow run boost-subset.yml
#   gh run download <run-id> -n boost-subset-macos -D /tmp/macos-subset
#   # union the file lists, commit, and rebuild on Linux to confirm
#
# It changes nothing in the repository by itself.
name: boost-subset

on:
  workflow_dispatch:

jobs:
  trace:
    name: trace Boost headers with clang on macOS
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Which clang, and which standard library
        run: |
          clang++ --version
          # The two selections that a Linux run cannot reproduce. Boost reads
          # them from predefined macros, so print the macros rather than guess.
          echo | clang++ -std=c++20 -dM -E -x c++ - |
            grep -E '__APPLE__|_LIBCPP_VERSION|__clang_major__' || true

      - name: Regenerate the subset from a clang trace
        run: ./third-party/regen-boost-subset.sh clang++

      - name: Report what this platform selects
        if: always()
        run: |
          echo "config headers this trace selected:"
          find third-party/boost/boost/config/compiler \
               third-party/boost/boost/config/platform \
               third-party/boost/boost/config/stdlib -type f | sort
          echo
          echo "total headers: $(find third-party/boost/boost -type f | wc -l)"

      # The subset is written before the script verifies it, and the verify step
      # fails on anything in vcache's own sources that does not compile here --
      # which is worth seeing separately from whether the trace worked. Upload
      # either way.
      - name: Upload the traced subset
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: boost-subset-macos
          path: third-party/boost
          retention-days: 7
